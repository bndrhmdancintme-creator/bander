<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #c9a463; }
    a:hover { color: #e0bd7e; }
  </style>
</helmet>
<div dir="rtl" style="
  width: 1080px; height: 1350px; position: relative; overflow: hidden;
  background: radial-gradient(120% 90% at 70% 8%, #182420 0%, #0d1210 45%, #060807 100%);
  font-family: 'Tajawal', sans-serif; color: #f3efe6;
">
  <div style="
    position: absolute; inset: 0; opacity: 0.05; mix-blend-mode: overlay; pointer-events: none;
    background-image: url(&quot;data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='200'%20height='200'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23n)'/%3E%3C/svg%3E&quot;);
  "></div>

  <div style="position: absolute; top: 88px; left: 88px; right: 88px; text-align: right;">
    <span style="font-family: 'Tajawal', sans-serif; font-weight: 500; font-size: 20px; letter-spacing: 0.05em; color: #8b9089;">قبل ما تكمل سكرولك</span>
  </div>

  <div style="position: absolute; top: 470px; right: 88px; left: 88px; text-align: right;">
    <h1 style="
      margin: 0 0 28px; font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 96px;
      line-height: 1.22; color: #f3efe6; text-wrap: pretty;
    ">٣ أسئلة تكشف<br>لك حقيقتك</h1>
    <p style="margin: 0; font-family: 'Tajawal', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.6; color: #b9beb6; max-width: 780px; margin-inline-start: auto;">
      قبل ما تنام الليلة، جاوب عليها بصراحة تامة مع نفسك.
    </p>
  </div>

  <div style="position: absolute; bottom: 88px; left: 88px; right: 88px; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-family: 'Cairo', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 0.08em; color: #8b9089;">حكمة بندر</span>
    <div style="display: flex; align-items: center; gap: 14px; color: #c9a463; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 22px;">
      <span>اسحب</span>
      <svg width="30" height="18" viewBox="0 0 30 18" fill="none">
        <path d="M29 9H1M1 9L9 1M1 9L9 17" stroke="#c9a463" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
