<x-dc>

<div dir="rtl" style="

">

  "></div>

  <div style="position: absolute; top: 88px; right: 88px; font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 0.05em; color: #c9a463;">
    #01
  </div>

  <div style="position: absolute; top: 150px; bottom: 210px; right: 88px; width: 1.5px; background: linear-gradient(to bottom, rgba(201,164,99,0.55), rgba(201,164,99,0.05));"></div>

  <div style="position: absolute; top: 470px; right: 132px; left: 88px; text-align: right;">
    <p style="margin: 0 0 20px; font-family: 'Tajawal', sans-serif; font-weight: 500; font-size: 24px; letter-spacing: 0.04em; color: #8b9089;">

    </p>
    <h1 style="
      margin: 0; font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 84px;
      line-height: 1.3; color: #f3efe6; text-wrap: pretty;
    ">هل انت راضي<br>عن نفسك؟</h1>
  </div>

  <div style="position: absolute; bottom: 88px; left: 88px; right: 88px; display: flex; justify-content: space-between; align-items: center;">
    <div style="width: 260px; height: 1px; background: linear-gradient(to right, transparent, #3a423d);"></div>
    <span style="font-family: 'Cairo', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 0.08em; color: #8b9089;">حكمة بندر</span>
